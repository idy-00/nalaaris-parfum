# Cloudflare Pages — liaisons D1 / R2 de l'espace admin.
# Ce fichier est la source des liaisons : elles ne se modifient plus dans le tableau de bord.
# Les secrets (ACCESS_AUD, ACCESS_TEAM_DOMAIN, ADMIN_EMAILS, DEPLOY_HOOK_URL) restent dans le tableau de bord
# (Settings → Variables and secrets, type « Secret ») : jamais dans le dépôt.
#
# Les database_id « a-remplacer » sont créés par `npm run cf:creer` (après `npx wrangler login`).
# Haut du fichier = développement local + aperçus (bases de TEST). [env.production] = site en ligne.

name = "nalaaris-parfum"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "nalaaris-test"
database_id = "7deb3c58-cc88-46f9-985e-b01ba764585b"
migrations_dir = "migrations"

# PHOTOS sera ajouté après activation explicite de R2 sur le compte.
# Les visuels existants restent servis depuis les fichiers publics.

[env.production]

[env.production.vars]
VITE_SITE_URL = "https://nalaaris-parfum.pages.dev"
ADMIN_USERNAME = "admin"
ADMIN_NAME = "Admin"
# Installation initiale uniquement : retirer dès que l'API publique est disponible.
DONNEES_URL = "aucune"

[[env.production.d1_databases]]
binding = "DB"
database_name = "nalaaris-prod"
database_id = "d72ae3b9-0cbb-464d-9e2b-6c75ad5bb467"
migrations_dir = "migrations"

