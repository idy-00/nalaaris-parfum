# Cloudflare Pages : D1 de test pour les aperçus, D1 de production pour main.
# Les secrets ADMIN_PASSWORD_HASH et ADMIN_SESSION_SECRET restent dans Cloudflare.
# R2 est facultatif et attend son activation sur le compte.

name = "nalaaris-parfum"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "nalaaris-test"
database_id = "7deb3c58-cc88-46f9-985e-b01ba764585b"
migrations_dir = "migrations"

# PHOTOS sera ajouté après activation explicite de R2 sur le compte.
# Les visuels existants restent servis depuis les fichiers publics.

[env.production]

[env.production.vars]
VITE_SITE_URL = "https://nalaaris-parfum.pages.dev"
ADMIN_USERNAME = "admin"
ADMIN_NAME = "Admin"

[[env.production.d1_databases]]
binding = "DB"
database_name = "nalaaris-prod"
database_id = "d72ae3b9-0cbb-464d-9e2b-6c75ad5bb467"
migrations_dir = "migrations"

